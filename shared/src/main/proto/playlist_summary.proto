syntax = "proto3";

option java_package = "com.metrolist.music.datastore";
option java_multiple_files = true;

message PlaylistSummaryProto {
  string id = 1;
  string browse_id = 2;
  string title = 3;
  string owner = 4;
  int32 track_count = 5;
  string artwork_url = 6;
  bool is_local = 7;
  string play_endpoint_params = 8;
  string shuffle_endpoint_params = 9;
  string radio_endpoint_params = 10;
}

message PlaylistCollectionProto {
  repeated PlaylistSummaryProto items = 1;
  uint64 request_id = 2;
  string source = 3;
  int64 generated_at = 4;
}

message LibraryEntryProto {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    PLAYLIST = 1;
    ALBUM = 2;
    ARTIST = 3;
    SONG = 4;
  }

  Type type = 1;
  string id = 2;
  string title = 3;
  string subtitle = 4;
  string artwork_url = 5;
  bool is_local = 6;
  string browse_id = 7;
  string play_endpoint_params = 8;
  string shuffle_endpoint_params = 9;
  string radio_endpoint_params = 10;
}

message LibrarySnapshotProto {
  repeated LibraryEntryProto entries = 1;
  uint64 request_id = 2;
  int64 generated_at = 3;
}
